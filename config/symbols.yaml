# =====================================================================
# symbols.yaml — daftar koin, timeframe, dan sumber data
# =====================================================================
data:
  # Urutan provider = urutan fallback. Satu simbol diambil dari SATU provider
  # untuk semua TF (konsistensi). Binance publik sering diblokir (HTTP 451)
  # dari IP runner GitHub (US) -> binance_rest mencoba beberapa host termasuk
  # data-api.binance.vision, lalu fallback ke exchange lain via ccxt.
  providers: ["binance_rest", "ccxt:okx", "ccxt:kucoin"]
  retries: 3
  backoff_seconds: 2.0
  timeout_seconds: 20

benchmark: "BTC/USDT"          # dipakai sebagai filter konteks untuk alts

# ---- Scanner universe otomatis ------------------------------------------------
# Daftar koin yang dianalisis ditentukan tiap run oleh scanner ini (bukan lagi daftar manual).
#   static        : pakai daftar `symbols` di bawah (perilaku sctn lama: 8 koin)
#   top_volume    : top-N spot USDT berdasar volume 24 jam
#   top_marketcap : top-N peringkat market cap (CoinGecko tanpa key / CoinMarketCap bila secret CMC_API_KEY ada),
#                   hanya yang punya pasangan USDT di exchange
# Bila semua sumber gagal -> otomatis turun ke daftar `symbols` di bawah (engine tidak berhenti).
universe:
  mode: "top_volume"
  top_n: 30
  quote: "USDT"
  volume_sources: ["binance", "ccxt:bitget", "ccxt:okx"]   # urutan fallback. Binance sering 451 dari runner GitHub -> lanjut ke Bitget
  marketcap_source: "coingecko"      # coingecko | cmc
  marketcap_pool: 150                # ambil 150 teratas lalu saring yang tersedia di exchange
  min_quote_volume: 5000000          # abaikan pasangan dengan volume 24 jam < 5 juta USDT (likuiditas tipis = scalp berbahaya)
  always_include: []                 # benchmark (BTC/USDT) otomatis selalu ikut
  exclude: []                        # tambahan base yang dikecualikan, mis. ["TRUMP"]. Stablecoin/wrapped/leveraged sudah otomatis dibuang
  timeout_seconds: 25

# Daftar cadangan (fallback bila scanner gagal) DAN dipakai backtest (backtest tidak bisa memutar ulang universe historis)
symbols:
  - "BTC/USDT"
  - "ETH/USDT"
  - "SOL/USDT"
  - "XRP/USDT"
  - "DOGE/USDT"
  - "ICP/USDT"
  - "AXS/USDT"
  - "TRUMP/USDT"

timeframes:
  bias: ["1w", "1d"]           # arah (bias) — BUKAN trigger
  structure: ["4h"]            # struktur / range besar
  trigger: ["1h", "15m"]       # trigger & timing entry
  primary_trigger: "1h"        # TF utama untuk range scalp & chart

candles:                       # jumlah candle yang diambil per TF
  "1w": 104
  "1d": 365
  "4h": 500
  "1h": 720
  "15m": 700
